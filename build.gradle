plugins {
    id 'java'
}

group = 'me.gadse'
version = '1.3.0-21.11'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'canvasmc'
        url = 'https://maven.canvasmc.io/releases'
    }
    maven {
        name = 'dmulloy2-repo'
        url = 'https://repo.dmulloy2.net/repository/public/'
    }
}

dependencies {
    // Folia API is a superset of Paper API (includes all paper-api classes +
    // Folia schedulers). Using only folia-api avoids the capability conflict
    // with paper-api while still letting the plugin run on plain Paper — the
    // Folia-only classes are referenced via reflection / runtime detection in
    // SchedulerUtil.
    compileOnly 'io.canvasmc.canvas:canvas-api:26.2.build.938-stable'
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.4.0-SNAPSHOT'
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
